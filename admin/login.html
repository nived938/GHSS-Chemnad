<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Govt. HSS Paravanadukkam</title>

<link rel="stylesheet" href="admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

<div class="login-box">

<img src="../images/logo.png" class="logo">

<h1>Admin Login</h1>

<p>Govt. HSS Paravanadukkam</p>

<form action="/login" method="POST">

<div class="input-box">

<i class="fas fa-user"></i>

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-box">

<i class="fas fa-lock"></i>

<input
type="password"
name="password"
placeholder="Password"
required>

</div>

<button type="submit">

<i class="fas fa-right-to-bracket"></i>

Login

</button>

</form>

<div class="footer">

© 2026 Govt. HSS Paravanadukkam

</div>

</div>

</div>

</body>

</html>
